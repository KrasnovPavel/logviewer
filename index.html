    if (this.colPattern.trim() && !this.colValid) this.elColRegex.classList.add('invalid');
    this._renderColList();
    this._updateColBadge();
  }

  // ── Temporal sync ─────────────────────────────────────────
  _computeSyncTimestamps() {
    const n = this.allLines.length;
    this.syncTimestamps = new Array(n).fill(null);
    if (!this.syncTimeCol || !this.syncTimeFmt) return;
    const parse = buildTimestampParser(this.syncTimeFmt);
    for (let i = 0; i < n; i++) {
      const line = this.allLines[i];
      let text = line;
      if (this.colRegex && this.colValid) {
        const m = this.colRegex.exec(line);
        if (m?.groups?.[this.syncTimeCol] !== undefined) text = m.groups[this.syncTimeCol];
      }
      this.syncTimestamps[i] = parse(text);
    }
  }
  _renderSyncViewport() {
    const total = gSyncRows.length;
    if (!total) { this.elWindow.innerHTML = ''; return; }
    const scrollT = this.elScroll.scrollTop, viewH = this.elScroll.clientHeight || 400;
    const start = Math.max(0, Math.floor(scrollT / LINE_H) - BUFFER);
    const end   = Math.min(total - 1, Math.ceil((scrollT + viewH) / LINE_H) + BUFFER);
    this.elWindow.style.top = (start * LINE_H) + 'px';
    const frag = document.createDocumentFragment();
    for (let r = start; r <= end; r++) {
      const entry = this.syncSide === 'A' ? gSyncRows[r].a : gSyncRows[r].b;
      if (entry?.coll) {
        frag.appendChild(this._makeRow(entry.coll));
      } else if (entry) {
        frag.appendChild(this._makeRow({ type: entry.fline ? 'fline' : 'line', lineIdx: entry.lineIdx }));
      } else {
        const ph = document.createElement('div');
        ph.className = 'sync-ph'; ph.style.height = LINE_H + 'px';
        frag.appendChild(ph);
      }
    }
    this.elWindow.innerHTML = '';
    this.elWindow.appendChild(frag);
  }
  _saveSyncCfg() {
    localStorage.setItem(this._storageKey('synccfg'), JSON.stringify({ timeCol: this.syncTimeCol, timeFmt: this.syncTimeFmt }));
  }
  _loadSyncCfg() {
    const s = localStorage.getItem(this._storageKey('synccfg'));
    if (s) {
      try { const d = JSON.parse(s); this.syncTimeCol = d.timeCol ?? 'timestamp'; this.syncTimeFmt = d.timeFmt ?? DEFAULT_SYNC_FMT; } catch {}
    }
  }

  // ── Selection actions ─────────────────────────────────────
  _addFilterWithPattern(pattern, mode) {
    const f = { id: ++this._fseq, pattern, mode, ci: false, disabled: false, regex: null, valid: true };
    this._compileF(f);
    this.filters.push(f);
    this._renderFList();
    this._updateFBadge();
    this._saveFilters();
    this._applyFilters();
    if (!this._filtersOpen) this._togglePanel('filter');
  }
  _addHighlightWithPattern(pattern) {
    this._addHighlight({ pattern, scope: 'text', colorMode: 'bg', color: '#4ec9b0', ci: false });
    if (!this._hlOpen) this._togglePanel('highlight');
  }
  _openSearchWith(text) {
    this._openSearch();
    this.elSearchInput.value = text;
    this._onSearchInput();
  }

  // ── Load / append files ────────────────────────────────────
  removeFile(segIdx) {
    const seg = this.fileSegments[segIdx]; if (!seg) return;
    const count = seg.endLine - seg.startLine;
    this.allLines.splice(seg.startLine, count);
    this.fileSegments.splice(segIdx, 1);
    for (let i = segIdx; i < this.fileSegments.length; i++) {
      this.fileSegments[i].startLine -= count;
      this.fileSegments[i].endLine   -= count;
    }
    this._updateFileHeader();
    if (!this.fileSegments.length) {
      this.expandedKeys.clear(); this.displayRows = []; this.visibleSet = new Set();
      this.elScroll.style.display = 'none'; this.elEmpty.style.display = '';
      this._updateFStats(); return;
    }
    this.elScroll.scrollTop = 0;
    this.searchRe = null; this.searchMatches = []; this.searchCurIdx = -1;
    if (this.elSearchInput.value) this._onSearchInput(); else this._updateSearchInfo();
    this._applyFilters();
  }

  loadFile(file) { this.loadFiles([file]); }

  loadFiles(fileList) {
    const files = Array.from(fileList);
    let pending = files.length;
    const results = new Array(files.length);
    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = e => {
        results[idx] = { name: file.name, text: e.target.result };
        if (--pending === 0) {
          this.allLines = []; this.fileSegments = [];
          this._mergeFiles(files.length > 1 ? this._sortByFirstTimestamp(results) : results);
        }
      };
      reader.readAsText(file);
    });
  }

  appendFiles(fileList) {
    const files = Array.from(fileList);
    let pending = files.length;
    const results = new Array(files.length);
    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = e => {
        results[idx] = { name: file.name, text: e.target.result };
        if (--pending === 0) this._mergeFiles(files.length > 1 ? this._sortByFirstTimestamp(results) : results);
      };
      reader.readAsText(file);
    });
  }

  // Timestamp of a file's first line, using the panel's configured column
  // regex + sync format when available, else the default log timestamp
  // pattern — same parsing machinery temporal sync uses per-line.
  _firstLineTimestamp(text) {
    const nl = text.indexOf('\n');
    const firstLine = (nl === -1 ? text : text.slice(0, nl)).replace(/\r$/, '');
    if (this.colRegex && this.colValid) {
      const m = this.colRegex.exec(firstLine);
      const key = this.syncTimeCol || 'timestamp';
      if (m?.groups?.[key] !== undefined) {
        const t = buildTimestampParser(this.syncTimeFmt || DEFAULT_SYNC_FMT)(m.groups[key]);
        if (t != null) return t;
      }
    }
    return buildTimestampParser(DEFAULT_SYNC_FMT)(firstLine);
  }

  // Multiple files dropped/opened at once get ordered by their first line's
  // timestamp before being appended into allLines — files with no parseable
  // timestamp keep their original relative order and sort after timestamped ones.
  _sortByFirstTimestamp(results) {
    return results
      .map((r, i) => ({ r, i, t: this._firstLineTimestamp(r.text) }))
      .sort((a, b) => {
        if (a.t == null && b.t == null) return a.i - b.i;
        if (a.t == null) return 1;
        if (b.t == null) return -1;
        return a.t - b.t || a.i - b.i;
      })
      .map(x => x.r);
  }

  _mergeFiles(results) {
    for (const { name, text } of results) {
      const startLine = this.allLines.length;
      const lines = text.split(/\r?\n/);
      if (lines[lines.length - 1] === '') lines.pop();
      for (const l of lines) this.allLines.push(l);
      this.fileSegments.push({ name, startLine, endLine: this.allLines.length });
    }
    this._updateFileHeader();
    this.elEmpty.style.display = 'none'; this.elScroll.style.display = 'block';
    this.elScroll.scrollTop = 0;
    this.searchRe = null; this.searchMatches = []; this.searchCurIdx = -1;
    if (this.elSearchInput.value) this._onSearchInput(); else this._updateSearchInfo();
    this._applyFilters();
  }

  _updateFileHeader() {
    const hasFiles = this.fileSegments.length > 0;
    const multi    = this.fileSegments.length > 1;
    this.elAdd.style.display        = hasFiles ? '' : 'none';
    this.elCloseFirst.style.display = (hasFiles && !multi) ? '' : 'none';
    if (!multi) this._closeFileDropdown();
    if (!hasFiles) {
      this.elName.textContent = 'No file open'; this.elName.title = ''; this.elName.classList.remove('expandable'); this.elName.classList.add('no-file'); return;
    }
    this.elName.classList.remove('no-file');
    if (!multi) {
      this.elName.textContent = this.fileSegments[0].name;
      this.elName.title = this.fileSegments[0].name;
      this.elName.classList.remove('expandable');
    } else {
      this.elName.textContent = this.fileSegments[0].name + ' +' + (this.fileSegments.length - 1) + ' more ▾';
      this.elName.title = 'Click to show all files';
      this.elName.classList.add('expandable');
      if (this._fdOpen) this._renderFileDropdown();
    }
  }

  _toggleFileDropdown() {
    this._fdOpen = !this._fdOpen;
    this.elFdWrap.classList.toggle('open', this._fdOpen);
    if (this._fdOpen) this._renderFileDropdown();
  }

  _closeFileDropdown() {
    this._fdOpen = false;
    this.elFdWrap.classList.remove('open');
  }

  _renderFileDropdown() {
    this.elFdWrap.innerHTML = '';
    const list = document.createElement('div');
    this.fileSegments.forEach((seg, i) => {
      const item = document.createElement('div'); item.className = 'ph-fd-item';
      const name = document.createElement('span'); name.className = 'ph-fd-name'; name.textContent = '📄 ' + seg.name; name.title = 'Jump to start of ' + seg.name;
      name.addEventListener('click', e => { e.stopPropagation(); this._scrollToLine(seg.startLine, 'top'); this._closeFileDropdown(); });
      const rm   = document.createElement('button'); rm.className = 'rm-btn'; rm.textContent = '×'; rm.title = 'Remove this file';
      rm.addEventListener('click', e => { e.stopPropagation(); this.removeFile(i); });
      item.append(name, rm); list.appendChild(item);
    });
    const foot    = document.createElement('div'); foot.className = 'ph-fd-foot';
    const clearBtn = document.createElement('button'); clearBtn.className = 'tb-btn'; clearBtn.textContent = 'Remove all';
    clearBtn.addEventListener('click', () => this._clearAllFiles());
    foot.appendChild(clearBtn);
    this.elFdWrap.append(list, foot);
  }

  _clearAllFiles() {
    this.allLines = []; this.fileSegments = [];
    this.expandedKeys.clear(); this.displayRows = []; this.visibleSet = new Set();
    this.elScroll.style.display = 'none'; this.elEmpty.style.display = '';
    this._closeFileDropdown();
    this._updateFileHeader();
    this._updateFStats();
    this.searchRe = null; this.searchMatches = []; this.searchCurIdx = -1;
    this._updateSearchInfo();
  }

  // ── Column header (resize + reorder) ──────────────────────────
  _renderColHeader() {
    const colsOn = this.colEnabled && this.colValid && this.columns.length;
    const jsonOn  = this.jsonMode && this.jsonColumns.length;
    const active  = !!(colsOn || jsonOn);

    this.elColHeader.classList.toggle('show', active);
    this.elScroll.style.top = active ? '20px' : '';
    this.elChInner.style.transform = `translateX(-${this.elScroll.scrollLeft}px)`;
    this.elChInner.innerHTML = '';
    if (!active) return;

    const arr         = jsonOn ? this.jsonColumns : this.columns;
    const displayCols = jsonOn ? arr : arr.filter(c => c.visible);

    const lnum = document.createElement('div');
    lnum.className = 'ch-lnum';
    this.elChInner.appendChild(lnum);

    for (let di = 0; di < displayCols.length; di++) {
      const col    = displayCols[di];
      const isLast = di === displayCols.length - 1;

      const cell = document.createElement('div');
      cell.className = 'ch-cell' + (isLast ? ' col-flex' : '');
      if (!isLast) cell.style.width = col.width + 'px';

      const lbl = document.createElement('span');
      lbl.className = 'ch-label';
      lbl.textContent = col.name;
      cell.appendChild(lbl);

      // Resize handle (not on last column)
      if (!isLast) {
        const handle = document.createElement('div');
        handle.className = 'ch-resize';
        handle.addEventListener('mousedown', e => {
          e.preventDefault(); e.stopPropagation();
          const startX = e.clientX;
          const startW = col.width;
          const onMove = ev => {
            col.width = Math.max(20, startW + ev.clientX - startX);
            cell.style.width = col.width + 'px';
            this._saveColumns();
            this._renderViewport();
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            this._renderColList();
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        cell.appendChild(handle);
      }

      // Drag to reorder
      cell.setAttribute('draggable', 'true');
      cell.addEventListener('dragstart', e => {
        this._dragColSrc = col.name;
        cell.classList.add('ch-dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      cell.addEventListener('dragend', () => {
        this._dragColSrc = null;
        cell.classList.remove('ch-dragging');
      });
      cell.addEventListener('dragover', e => {
        if (!this._dragColSrc || this._dragColSrc === col.name) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        cell.classList.add('ch-drag-over');
      });
      cell.addEventListener('dragleave', () => cell.classList.remove('ch-drag-over'));
      cell.addEventListener('drop', e => {
        e.preventDefault(); cell.classList.remove('ch-drag-over');
        if (!this._dragColSrc || this._dragColSrc === col.name) return;
        this._moveCol(arr, this._dragColSrc, col.name);
        this._dragColSrc = null;
        this._saveColumns();
        this._renderColList();
        this._renderColHeader();
        this._renderViewport();
      });

      this.elChInner.appendChild(cell);
    }
  }

  _moveCol(arr, srcName, dstName) {
    const si = arr.findIndex(c => c.name === srcName);
    const di = arr.findIndex(c => c.name === dstName);
    if (si === -1 || di === -1 || si === di) return;
    const [col] = arr.splice(si, 1);
    arr.splice(di, 0, col);
  }

  onResize() { this._renderViewport(); }
}

// ─── Selection popup ───────────────────────────────────────────
let _selPanel = null, _selText = '';
const _selPopup = (() => {
  const el = document.createElement('div');
  el.className = 'sel-popup';
  el.innerHTML = `
    <button class="sel-action incl" data-a="incl" title="Add include filter for this text">Show only</button>
    <button class="sel-action excl" data-a="excl" title="Add exclude filter for this text">Hide lines</button>
    <button class="sel-action"      data-a="hl"   title="Highlight this text">Highlight</button>
    <button class="sel-action"      data-a="find" title="Search for this text">Search</button>
  `;
  document.body.appendChild(el);
  el.addEventListener('mousedown', e => e.stopPropagation());
  el.addEventListener('click', e => {
    const btn = e.target.closest('[data-a]');
    if (!btn || !_selPanel) return;
    const escaped = escapeRegex(_selText);
    switch (btn.dataset.a) {
      case 'incl': _selPanel._addFilterWithPattern(escaped, 'include'); break;
      case 'excl': _selPanel._addFilterWithPattern(escaped, 'exclude'); break;
      case 'hl':   _selPanel._addHighlightWithPattern(escaped);         break;
      case 'find': _selPanel._openSearchWith(escaped);                  break;
    }
    hideSelPopup();
    window.getSelection().removeAllRanges();
  });
  return el;
})();

function showSelPopup(panel, text, cx, cy) {
  _selPanel = panel; _selText = text;
  _selPopup.style.left = '0'; _selPopup.style.top = '0';
  _selPopup.classList.add('show');
  requestAnimationFrame(() => {
    const pw = _selPopup.offsetWidth, ph = _selPopup.offsetHeight;
    let left = cx - pw / 2;
    let top  = cy - ph - 8;
    if (top < 4) top = cy + 22;
    left = Math.max(4, Math.min(left, window.innerWidth - pw - 4));
    _selPopup.style.left = left + 'px';
    _selPopup.style.top  = top  + 'px';
  });
}
function hideSelPopup() {
  _selPopup.classList.remove('show');
  _selPanel = null; _selText = '';
}

document.addEventListener('mousedown', () => hideSelPopup());
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideSelPopup(); });

// ─── Init ──────────────────────────────────────────────────────
const panelL = new Panel(document.getElementById('panelL'), 'L');
const panelR = new Panel(document.getElementById('panelR'), 'R');
panelL.syncSide = 'A'; panelL.otherPanel = panelR;
panelR.syncSide = 'B'; panelR.otherPanel = panelL;

// ── Sync bar ─────────────────────────────────────────────────
(function () {
  const bar        = document.getElementById('syncBar');
  const enableEl   = document.getElementById('syncEnable');
  const colAEl     = document.getElementById('syncColA');
  const fmtAEl     = document.getElementById('syncFmtA');
  const offsetEl   = document.getElementById('syncOffset');
  const colBEl     = document.getElementById('syncColB');
  const fmtBEl     = document.getElementById('syncFmtB');

  // Load saved global sync config
  const saved = localStorage.getItem('logviewer-sync');
  if (saved) {
    try {
      const d = JSON.parse(saved);
      gSyncEnabled  = !!d.enabled;
      gSyncOffsetMs = d.offsetMs ?? 0;
    } catch {}
  }

  // Init UI from state
  enableEl.checked  = gSyncEnabled;
  offsetEl.value    = gSyncOffsetMs;
  colAEl.value      = panelL.syncTimeCol;
  fmtAEl.value      = panelL.syncTimeFmt;
  colBEl.value      = panelR.syncTimeCol;
  fmtBEl.value      = panelR.syncTimeFmt;
  if (gSyncEnabled) bar.classList.add('show');

  document.getElementById('syncToggleBtn').addEventListener('click', () => bar.classList.toggle('show'));

  enableEl.addEventListener('change', e => {
    gSyncEnabled = e.target.checked;
    saveGlobalSync();
    if (gSyncEnabled) {
      rebuildSync();
    } else {
      gSyncRows = [];
      // The active row list switches from gSyncRows-indexed back to
      // displayRows-indexed — a completely different meaning per index, so
      // any cached wrap heights from the synced state are meaningless now.
      panelL._invalidateWrapHeights(); panelR._invalidateWrapHeights();
      panelL._updateSpacer(); panelL._renderViewport();
      panelR._updateSpacer(); panelR._renderViewport();
    }
  });

  offsetEl.addEventListener('input', e => {
    gSyncOffsetMs = parseInt(e.target.value) || 0;
    saveGlobalSync();
    if (gSyncEnabled) rebuildSync();
  });

  colAEl.addEventListener('input', e => { panelL.syncTimeCol = e.target.value.trim(); panelL._saveSyncCfg(); if (gSyncEnabled) rebuildSync(); });
  fmtAEl.addEventListener('input', e => { panelL.syncTimeFmt = e.target.value.trim(); panelL._saveSyncCfg(); if (gSyncEnabled) rebuildSync(); });
  colBEl.addEventListener('input', e => { panelR.syncTimeCol = e.target.value.trim(); panelR._saveSyncCfg(); if (gSyncEnabled) rebuildSync(); });
  fmtBEl.addEventListener('input', e => { panelR.syncTimeFmt = e.target.value.trim(); panelR._saveSyncCfg(); if (gSyncEnabled) rebuildSync(); });
})();

// ── Settings export / import ─────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('logviewer-')) data[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'logviewer-settings.json'; a.click();
  URL.revokeObjectURL(url);
});

(function () {
  const fileInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        let count = 0;
        for (const [k, v] of Object.entries(data)) {
          if (k.startsWith('logviewer-')) { localStorage.setItem(k, v); count++; }
        }
        if (count === 0) { alert('No logviewer settings found in file.'); return; }
        location.reload();
      } catch (err) {
        alert('Failed to load settings: ' + err.message);
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });
})();

// Row index into whichever list a panel is currently rendering (displayRows
// normally, gSyncRows while synced) that sits at the top of its viewport —
// used to restore roughly the same logical scroll position across a wrap
// toggle or a width change (splitter drag/reset, window resize), both of
// which change wrap mode's row heights. Both directions are now pure
// arithmetic over the cached prefix-sum array (_wrapPrefix) — no DOM reads
// at all — so capturing/restoring this is effectively free regardless of
// file size; it no longer needs to force (or avoid forcing) any reflow.
function topRowIndex(panel) {
  if (wrapActive()) return panel._wrapRowAtOffset(panel.elScroll.scrollTop);
  return Math.floor(panel.elScroll.scrollTop / LINE_H);
}
function scrollToRowIndex(panel, rowIdx) {
  if (wrapActive()) {
    const n = panel._activeRowCount();
    panel._ensureWrapPrefix(n);
    panel.elScroll.scrollTop = panel._wrapPrefix[Math.max(0, Math.min(rowIdx, n))];
  } else {
    panel.elScroll.scrollTop = rowIdx * LINE_H;
  }
}
function captureResizeAnchor() {
  if (!wrapActive()) return null;
  return { l: topRowIndex(panelL), r: topRowIndex(panelR) };
}
// Apply a width change: restore the row-index anchor and re-render. Because
// wrap mode is now virtualized (only ~30 rows around the viewport are ever
// built/measured, regardless of file size — see Panel._renderWrapVirtual),
// this whole sequence is cheap enough to run on every single mousemove tick
// of a splitter drag or 'resize' event, the same way classic mode already
// does — no more skipping/throttling/deferring needed.
//
// Deliberately does NOT invalidate the wrap height cache here. A row's
// pre-resize height is a stale-but-reasonable estimate for its post-resize
// height (better than resetting to the single-line default), and every
// render already re-measures whatever it actually draws and updates the
// cache for just those rows — wiping the whole cache on every tick would
// throw away everything except the visible window and recompute the
// anchor's target scrollTop against pure defaults each time, which is what
// made the view drift instead of staying pinned during a drag.
function applyResizeAnchor(anchor, done) {
  if (anchor) {
    scrollToRowIndex(panelL, anchor.l);
    // In sync mode both panels track the same row — mirror the exact
    // resulting scrollTop instead of recomputing it independently.
    if (gSyncEnabled) panelR.elScroll.scrollTop = panelL.elScroll.scrollTop;
    else scrollToRowIndex(panelR, anchor.r);
  }
  panelL.onResize();
  // In sync+wrap mode the call above already rendered and equalized both
  // panels via renderSyncWrapBoth() — a second pass would just redo it.
  if (!(gSyncEnabled && wrapActive())) panelR.onResize();
  done?.();
}

(function () {
  const btn = document.getElementById('wrapBtn');
  gWrapLines = localStorage.getItem('logviewer-wrap') === '1';
  const apply = () => {
    document.body.classList.toggle('wrap-lines', wrapActive());
    btn.textContent = gWrapLines ? '↵ Wrap: On' : '↵ Wrap: Off';
    panelL._renderViewport();
    // In sync+wrap mode the call above already rendered and height-equalized
    // both panels via renderSyncWrapBoth() — a second full pass would just
    // redo the same work.
    if (!(gSyncEnabled && wrapActive())) panelR._renderViewport();
  };

  apply();
  btn.addEventListener('click', () => {
    const anchorL = topRowIndex(panelL);
    const anchorR = topRowIndex(panelR);
    gWrapLines = !gWrapLines;
    localStorage.setItem('logviewer-wrap', gWrapLines ? '1' : '0');
    apply();
    scrollToRowIndex(panelL, anchorL);
    // In sync mode both panels track the same row — mirror the exact
    // resulting scrollTop instead of recomputing it independently.
    if (gSyncEnabled) panelR.elScroll.scrollTop = panelL.elScroll.scrollTop;
    else scrollToRowIndex(panelR, anchorR);
  });
})();

(function () {
  const btn = document.getElementById('lnumBtn');
  let showLnum = localStorage.getItem('logviewer-lnum') === '1';
  const apply = () => {
    document.body.classList.toggle('show-lnum', showLnum);
    btn.textContent = showLnum ? '☰ Line #: On' : '☰ Line #: Off';
  };
  apply();
  btn.addEventListener('click', () => {
    // Hiding/showing the gutter changes each panel's available text width,
    // which in wrap mode shifts where lines wrap — re-render like a resize
    // so visible rows pick up correct heights (off-screen rows self-correct
    // once scrolled to, same as window resize already tolerates).
    const anchorL = topRowIndex(panelL);
    const anchorR = topRowIndex(panelR);
    showLnum = !showLnum;
    localStorage.setItem('logviewer-lnum', showLnum ? '1' : '0');
    apply();
    applyResizeAnchor({ l: anchorL, r: anchorR });
  });
})();

document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '☾ Dark' : '☀ Light';
});

// Collapse a panel to a thin strip and let the other one fill the freed
// space, or restore both to their pre-collapse widths. The collapsed panel's
// own sizing is handled entirely by the .collapsed CSS class (!important, so
// it wins over any inline flex left by a previous splitter drag) — only the
// *other* panel's inline flex needs to be saved/overridden/restored here.
function setPanelCollapsed(panel, collapsed) {
  const other = panel.otherPanel;
  if (collapsed && other.root.classList.contains('collapsed')) setPanelCollapsed(other, false);
  panel.root.classList.toggle('collapsed', collapsed);
  if (collapsed) {
    other._preCollapseFlex = other.root.style.flex;
    other.root.style.flex = '1 1 auto';
  } else if (other._preCollapseFlex !== undefined) {
    other.root.style.flex = other._preCollapseFlex;
  }
  document.getElementById('splitter').classList.toggle('disabled',
    panel.root.classList.contains('collapsed') || other.root.classList.contains('collapsed'));
  panel.onResize();
  other.onResize();
}

(function () {
  const splitter = document.getElementById('splitter');
  const wrap = document.getElementById('panelsWrap');
  const left = document.getElementById('panelL'), right = document.getElementById('panelR');
  let dragging = false, startX = 0, startLW = 0, dragAnchor = null;
  splitter.addEventListener('mousedown', e => {
    if (left.classList.contains('collapsed') || right.classList.contains('collapsed')) return;
    dragging = true; startX = e.clientX; startLW = left.getBoundingClientRect().width;
    dragAnchor = captureResizeAnchor(); // before any width change happens this drag
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const total = wrap.getBoundingClientRect().width - 4;
    const newLW = Math.max(120, Math.min(total - 120, startLW + (e.clientX - startX)));
    const pct = (newLW / total * 100).toFixed(3);
    left.style.flex = `0 0 ${pct}%`; right.style.flex = `0 0 ${(100 - parseFloat(pct)).toFixed(3)}%`;
    // Wrap mode is now virtualized (Panel._renderWrapVirtual only builds/
    // measures the ~30 rows around the viewport, regardless of file size),
    // so — unlike before — it's cheap enough to just re-render live on every
    // tick, the same way classic mode already did.
    applyResizeAnchor(dragAnchor);
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return; dragging = false; splitter.classList.remove('dragging');
    document.body.style.cursor = document.body.style.userSelect = '';
  });
  splitter.title = 'Drag to resize · Double-click to reset to equal size';
  splitter.addEventListener('dblclick', () => {
    if (left.classList.contains('collapsed') || right.classList.contains('collapsed')) return;
    const anchor = captureResizeAnchor();
    left.style.flex = ''; right.style.flex = '';
    applyResizeAnchor(anchor);
  });
})();

// Window resize can fire many events per second while the OS window edge is
// being dragged. Each is now cheap (virtualized wrap re-render), but the
// anchor is still captured once per burst (not re-captured every event) so
// the row that was on-screen when the resize started stays pinned there for
// the whole burst, instead of drifting tick to tick.
let _winResizeIdleTimer = null, _winResizeAnchor;
window.addEventListener('resize', () => {
  if (_winResizeAnchor === undefined) _winResizeAnchor = captureResizeAnchor();
  applyResizeAnchor(_winResizeAnchor);
  clearTimeout(_winResizeIdleTimer);
  _winResizeIdleTimer = setTimeout(() => { _winResizeAnchor = undefined; }, 150);
});
</script>
</body>
</html>
