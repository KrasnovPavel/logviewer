<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Window background -->
  <rect width="48" height="48" rx="8" fill="#1e1e1e"/>
  <!-- Log line 1: ERROR red -->
  <rect x="5" y="10"  width="38" height="7" rx="2" fill="#ff4040" opacity=".25"/>
  <rect x="5" y="10"  width="12" height="7" rx="2" fill="#ff4040"/>
  <!-- Log line 2: gray -->
  <rect x="5" y="20"  width="38" height="7" rx="2" fill="#666"/>
  <!-- Log line 3: WARN yellow -->
  <rect x="5" y="30"  width="38" height="7" rx="2" fill="#febc2e" opacity=".25"/>
  <rect x="5" y="30"  width="22" height="7" rx="2" fill="#febc2e"/>
</svg>
